name: Test and deploy Lambda

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install test tools
        run: pip install -r backend/requirements-dev.txt

      - name: Run unit tests
        run: pytest -v backend/tests

  deploy:
    needs: test   # テストが全部通ったときだけデプロイする
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Package Lambda code
        run: cd backend && zip ../function.zip lambda_function.py

      - name: Update Lambda function code
        run: aws lambda update-function-code --function-name visitor-counter --zip-file fileb://function.zip
