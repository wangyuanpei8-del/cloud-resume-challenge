<text x="56" y="398" font-weight="600" fill="#202d3d">GitHub Actions</text>
<text x="56" y="416" text-anchor="start" font-size="11.5" fill="#536579">frontend/ の変更を S3 に同期</text>
<text x="56" y="432" text-anchor="start" font-size="11.5" fill="#536579">テスト成功後に Lambda のコードを更新</text>
<rect x="390" y="374" width="330" height="72" rx="8" fill="#ffffff" stroke="#8fa1b3" stroke-width="1.25"/>
<text x="406" y="398" font-weight="600" fill="#202d3d">Terraform</text>
<text x="406" y="416" text-anchor="start" font-size="11.5" fill="#536579">配信・バックエンド・監視の設定をコードで管理</text>
<text x="406" y="432" text-anchor="start" font-size="11.5" fill="#536579">コンソールで作成済みのリソースを import</text>
</svg>
