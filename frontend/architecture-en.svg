<text x="56" y="398" font-weight="600" fill="#202d3d">GitHub Actions</text>
<text x="56" y="416" text-anchor="start" font-size="11.5" fill="#536579">Syncs frontend/ changes to S3</text>
<text x="56" y="432" text-anchor="start" font-size="11.5" fill="#536579">Updates Lambda code after tests pass</text>
<rect x="390" y="374" width="330" height="72" rx="8" fill="#ffffff" stroke="#8fa1b3" stroke-width="1.25"/>
<text x="406" y="398" font-weight="600" fill="#202d3d">Terraform</text>
<text x="406" y="416" text-anchor="start" font-size="11.5" fill="#536579">Manages delivery, backend, and monitoring as code</text>
<text x="406" y="432" text-anchor="start" font-size="11.5" fill="#536579">Console-built resources were imported</text>
</svg>
